[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ftw-fbp"
version = "0.1.0"
description = "Field boundary prediction post-processing algorithms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Isaac Corley", email = "isaac.corley@taylorgeospatial.org" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26",
    "scikit-image>=0.22",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15",
    "ty>=0.0.1a32",
]

[project.urls]
Repository = "https://github.com/fieldsoftheworld/fbp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH",
    "ARG", "RUF", "ANN", "D", "PL", "TID", "PIE", "TRY", "NPY",
]
ignore = ["FA100", "FA102", "N806", "PLR2004", "TRY003", "RUF046"]
extend-safe-fixes = []
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D107", "ARG001", "ARG002", "ARG005"]
"src/fbp/methods/boundaryvote.py" = ["PLR0912", "PLR0913", "PLR0915"]
"src/fbp/core/merge.py" = ["PLR0913", "PLR0917"]
"src/fbp/windowed.py" = ["PLR0913"]  # run_windowed mirrors run() plus window options

[tool.ruff.lint.isort]
known-first-party = ["fbp"]
required-imports = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["default"]

[tool.coverage.run]
source = ["fbp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.12"
root = ["src", "tests"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
possibly-missing-implicit-call = "error"
division-by-zero = "error"
redundant-cast = "error"
unused-ignore-comment = "error"
unresolved-import = "warn"

[tool.ty.terminal]
output-format = "concise"
